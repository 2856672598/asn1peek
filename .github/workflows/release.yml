name: Linux release

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python 3.13)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run --frozen pytest -q
      - run: uv run --frozen ruff check .
      - run: uv lock --check
      - run: bash -n scripts/*.sh

  build:
    name: Build ${{ matrix.arch }} (Ubuntu 22.04)
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify in native Jammy container
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            --env DEBIAN_FRONTEND=noninteractive \
            ubuntu:22.04 bash -euc '
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends \
                ca-certificates curl file binutils dpkg-dev squashfs-tools desktop-file-utils \
                libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
                libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
                libxkbcommon-x11-0 libdbus-1-3 libssl3 libfontconfig1 libgl1 \
                libegl1 libx11-6 libxcb1 libxkbcommon0 libglib2.0-0 libstdc++6
              printf "%s\\n" 0123456789abcdef0123456789abcdef > /etc/machine-id
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="$HOME/.local/bin:$PATH"
              export APPIMAGE_EXTRACT_AND_RUN=1
              uv python install 3.13
              uv sync --frozen --all-groups
              bash scripts/build_appimage.sh
              bash scripts/build_deb.sh
              appimage="$(find dist -maxdepth 1 -name "asn1peek-*.AppImage" -print -quit)"
              deb="$(find dist -maxdepth 1 -name "asn1peek_*_*.deb" -print -quit)"
              test -n "$appimage" && test -n "$deb"
              bash scripts/verify_artifact.sh "$appimage" "$deb" "$(uname -m)"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [tests, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard tag version and main ancestry
        env:
          GH_REF: ${{ github.ref }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin main
          tag_version="${GH_REF#refs/tags/v}"
          project_version="$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          test "$tag_version" = "$project_version"
          git merge-base --is-ancestor "$GH_SHA" origin/main
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: release-assets
          merge-multiple: true
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag="${GH_REF#refs/tags/}"
          gh release create "$tag" release-assets/* \
            --draft \
            --title "asn1peek ${tag#v}" \
            --notes "Automated Ubuntu 22.04 amd64/arm64 AppImage and deb builds."
